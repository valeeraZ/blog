<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#267da3" stroke-width="1.5"/></marker></defs><rect width="1440" height="720" fill="#f2f6fa"/><text x="54" y="47" font-family="Arial, sans-serif" font-size="17" fill="#267da3" font-weight="700">02 / FAILURE ISOLATION</text><text x="54" y="96" font-family="Arial, sans-serif" font-size="36" fill="#122b44" font-weight="700">One application fails over; the others keep their primary</text><rect x="54" y="156" width="408" height="320" rx="14" fill="#e9f3ec" stroke="#b6d0bd" stroke-width="2"/><text x="76" y="192" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">Healthy</text><text x="76" y="225" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App A → Gateway A → App A</text><text x="76" y="253" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App B → Gateway A → App B</text><text x="76" y="281" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400"></text><text x="76" y="309" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">Gateway B remains the backup.</text><rect x="514" y="156" width="408" height="320" rx="14" fill="#fff2e5" stroke="#e4c8a6" stroke-width="2"/><text x="536" y="192" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">App A fails in Cluster A</text><text x="536" y="225" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App A → Gateway B → App A</text><text x="536" y="253" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App B → Gateway A → App B</text><text x="536" y="281" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400"></text><text x="536" y="309" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">Only App A changes cluster.</text><rect x="974" y="156" width="408" height="320" rx="14" fill="#e9f3ec" stroke="#b6d0bd" stroke-width="2"/><text x="996" y="192" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">App A recovers</text><text x="996" y="225" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App A → Gateway A → App A</text><text x="996" y="253" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App B → Gateway A → App B</text><text x="996" y="281" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400"></text><text x="996" y="309" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">New requests prefer A again.</text><path d="M462 312 L514 312" fill="none" stroke="#267da3" stroke-width="3"  marker-end="url(#arrow)"/><path d="M922 312 L974 312" fill="none" stroke="#267da3" stroke-width="3"  marker-end="url(#arrow)"/><text x="54" y="543" font-family="Arial, sans-serif" font-size="27" fill="#142c45" font-weight="700">Probe each API through each gateway</text><text x="54" y="589" font-family="Arial, sans-serif" font-size="23" fill="#24364b" font-weight="400">GET /api/app-a/health/ready     •     HTTP 200 = ready; HTTP 503 = unavailable</text><text x="54" y="635" font-family="Arial, sans-serif" font-size="21" fill="#24364b" font-weight="400">Illustrative thresholds: every 5 seconds; 3 failures to remove; 3 successes to restore.</text><text x="54" y="681" font-family="Arial, sans-serif" font-size="21" fill="#24364b" font-weight="400">Detection takes time. In-flight requests can fail, and writes must not be blindly replayed.</text></svg>
ly="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">port 8000</text><path d="M705 300 L841 274" fill="none" stroke="#267da3" stroke-width="3"  marker-end="url(#arrow)"/><text x="711" y="249" font-family="Arial, sans-serif" font-size="18" fill="#267da3" font-weight="700">Primary</text><path d="M705 382 L841 550" fill="none" stroke="#617395" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="708" y="489" font-family="Arial, sans-serif" font-size="18" fill="#617395" font-weight="700">Backup</text><text x="54" y="590" font-family="Arial, sans-serif" font-size="24" fill="#142c45" font-weight="700">NGINX selects the gateway.</text><text x="54" y="628" font-family="Arial, sans-serif" font-size="22" fill="#24364b" font-weight="400">Istio routes to the local application.</text><text x="54" y="683" font-family="Arial, sans-serif" font-size="21" fill="#24364b" font-weight="400">Both gateways accept Host + TLS SNI = api.example.com. No cross-mesh discovery is required.</text></svg>
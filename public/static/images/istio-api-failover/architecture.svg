<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#267da3" stroke-width="1.5"/></marker></defs><rect width="1440" height="720" fill="#f2f6fa"/><text x="54" y="47" font-family="Arial, sans-serif" font-size="17" fill="#267da3" font-weight="700">01 / REQUEST PATH</text><text x="54" y="96" font-family="Arial, sans-serif" font-size="36" fill="#122b44" font-weight="700">Reuse the ingress already in front of your applications</text><rect x="54" y="277" width="245" height="126" rx="14" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/><text x="76" y="313" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">Browser</text><text x="76" y="346" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">API base URL:</text><text x="76" y="374" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">api.example.com</text><path d="M299 340 L355 340" fill="none" stroke="#267da3" stroke-width="3"  marker-end="url(#arrow)"/><rect x="355" y="252" width="350" height="176" rx="14" fill="#e1f0f5" stroke="#91bdce" stroke-width="2"/><text x="377" y="288" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">Existing NGINX Plus</text><text x="377" y="321" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">VirtualServer: api.example.com</text><text x="377" y="349" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App A: independent upstream</text><text x="377" y="377" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">App B: independent upstream</text><rect x="817" y="160" width="566" height="219" rx="18" fill="#e9f3ec" stroke="#b6d0bd"/><text x="838" y="195" font-family="Arial, sans-serif" font-size="18" fill="#39674a" font-weight="700"
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#267da3" stroke-width="1.5"/></marker></defs><rect width="1440" height="720" fill="#f2f6fa"/><text x="54" y="47" font-family="Arial, sans-serif" font-size="17" fill="#267da3" font-weight="700">03 / HTTPS ROUTING</text><text x="54" y="96" font-family="Arial, sans-serif" font-size="36" fill="#122b44" font-weight="700">The connection address and the request identity are different</text><rect x="54" y="173" width="390" height="147" rx="14" fill="#e1f0f5" stroke="#91bdce" stroke-width="2"/><text x="76" y="209" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">1. Resolve a gateway</text><text x="76" y="242" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">example.asm.com → Gateway A IP</text><text x="76" y="270" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">example.bsm.com → Gateway B IP</text><path d="M444 246 L509 246" fill="none" stroke="#267da3" stroke-width="3"  marker-end="url(#arrow)"/><rect x="509" y="173" width="393" height="147" rx="14" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/><text x="531" y="209" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">2. Open TLS to that IP</text><text x="531" y="242" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">SNI: api.example.com</text><text x="531" y="270" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">Verify certificate + trusted CA</text><path d="M902 246 L967 246" fill="none" stroke="#267da3" stroke-width="3"  marker-end="url(#arrow)"/><rect x="967" y="173" width="417" height="147" rx="14" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/><text x="989" y="209" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">3. Send the HTTP request</text><text x="989" y="242" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">Host: api.example.com</text><text x="989" y="270" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">GET /api/app-a/users</text><rect x="54" y="385" width="1330" height="132" rx="14" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/><text x="76" y="421" font-family="Arial, sans-serif" font-size="23" fill="#142c45" font-weight="700">Istio uses the shared identity to route the request</text><text x="76" y="454" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">Gateway accepts api.example.com; VirtualService matches the Host and API path.</text><text x="76" y="482" font-family="Arial, sans-serif" font-size="19" fill="#24364b" font-weight="400">The destination is the local Kubernetes Service, which forwards to the application.</text><text x="54" y="580" font-family="Arial, sans-serif" font-size="24" fill="#142c45" font-weight="700">Keep the two gateway DNS names pointing directly to their respective gateways.</text><text x="54" y="626" font-family="Arial, sans-serif" font-size="21" fill="#24364b" font-weight="400">Point api.example.com to the existing NGINX ingress. Reusing it as an upstream creates a proxy loop.</text><text x="54" y="679" font-family="Arial, sans-serif" font-size="21" fill="#24364b" font-weight="400">Health probes need the same HTTPS, SNI, Host and routing behavior as application traffic.</text></svg>